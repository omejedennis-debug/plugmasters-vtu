<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - PlugMasters</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fdf6e9] min-h-screen">
<div class="bg-[#7a5a1a] text-white p-4 flex justify-between">
<button onclick="history.back()" class="bg-white text-black px-3 py-1 rounded-full text-sm">← Back</button>
<h1 class="font-bold">All Users LIVE</h1>
</div>
<div class="p-4">
<div class="bg-white rounded-xl p-4 shadow">
<table class="w-full text-sm"><thead><tr class="bg-[#7a5a1a] text-white"><th class="p-2 text-left">Name</th><th>Phone</th><th>Wallet</th><th>Action</th></tr></thead><tbody id="list"></tbody></table>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCpQl-jOS4-6bLa5L383dqR5y3JmFT5exA",
  authDomain: "plugmasters-vtu.firebaseapp.com",
  projectId: "plugmasters-vtu",
  storageBucket: "plugmasters-vtu.firebasestorage.app",
  messagingSenderId: "217536430232",
  appId: "1:217536430232:web:8a56dd1f34b38a380e10ed"
};
const db = getFirestore(initializeApp(firebaseConfig));
async function load(){
  const snap = await getDocs(collection(db,"users"));
  let h="";
  snap.forEach(d=>{
    const u=d.data();
    h+=`<tr class="border-b"><td class="p-2">${u.name}</td><td class="p-2">${u.phone}</td><td class="p-2">₦${u.wallet||0}</td><td class="p-2"><button onclick="fund('${d.id}',${u.wallet||0})" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Fund +1429</button></td></tr>`;
  });
  document.getElementById('list').innerHTML=h;
}
window.fund = async (id, oldW)=>{
  const amt = 1429;
  await updateDoc(doc(db,"users",id), {wallet: oldW+amt});
  alert('Funded ₦'+amt); load();
};
load();
</script>
</body>
</html>
