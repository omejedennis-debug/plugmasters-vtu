<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard - PlugMasters</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{margin:0;background:#f4f1e8}
.header{background:#8B6914;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.header h2{margin:0;font-size:18px}
.btn-out{background:#fff;color:#8B6914;border:none;padding:7px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.container{max-width:1000px;margin:15px auto;padding:0 12px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h3{margin:0 0 10px;color:#8B6914}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
th{background:#8B6914;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.stat b{font-size:20px;display:block;color:#8B6914}
</style>
<script>
// FIX REDIRECT LOOP - check all 3 keys
(function(){
  const ok = localStorage.getItem('pm_admin') || localStorage.getItem('isAdmin') || localStorage.getItem('adminLoggedIn');
  if(!ok){
    window.location.href='admin-login.html';
  }
})();
</script>
</head>
<body>
<div class="header">
<h2>PlugMasters Super Admin</h2>
<button class="btn-out" onclick="logout()">Logout</button>
</div>

<div class="container">
<div class="stats">
<div class="stat"><b id="totalUsers">0</b><span>Total Users</span></div>
<div class="stat"><b id="totalWallet">₦0</b><span>Wallet Balance</span></div>
<div class="stat"><b>23</b><span>Menus Active</span></div>
</div>

<div class="card">
<h3>All Users (Real from Firebase)</h3>
<table id="usersTable"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Wallet</th><th>Date</th></tr></thead><tbody><tr><td colspan="5">Loading...</td></tr></tbody></table>
</div>
</div>

<script type="module">
import { db } from '../firebase.js';
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function load(){
  try{
    const snap = await getDocs(collection(db,'users'));
    const tbody = document.querySelector('#usersTable tbody');
    tbody.innerHTML='';
    let count=0, totalW=0;
    snap.forEach(d=>{
      count++;
      const u=d.data();
      totalW+=Number(u.wallet||0);
      tbody.innerHTML+=`<tr><td>${u.name||'-'}</td><td>${u.phone||'-'}</td><td>${u.email||'-'}</td><td>₦${u.wallet||0}</td><td>${(u.createdAt||'').slice(0,10)}</td></tr>`;
    });
    document.getElementById('totalUsers').textContent=count;
    document.getElementById('totalWallet').textContent='₦'+totalW;
    if(count===0) tbody.innerHTML='<tr><td colspan="5">No users yet - Create via /signup.html</td></tr>';
  }catch(e){
    document.querySelector('#usersTable tbody').innerHTML=`<tr><td colspan="5">Error: ${e.message}<br>Go Firebase Console > Firestore > Create Database > Test Mode</td></tr>`;
  }
}
load();

window.logout=function(){
  localStorage.removeItem('pm_admin');
  localStorage.removeItem('isAdmin');
  localStorage.removeItem('adminLoggedIn');
  window.location.href='admin-login.html';
}
</script>
</body>
</html>
