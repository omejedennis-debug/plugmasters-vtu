<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login - PlugMasters</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{background:#f5f1e6;padding:15px}
.box{max-width:420px;margin:30px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
h1{text-align:center;color:#8B6914}input{width:100%;padding:13px;margin-top:8px;border:1.5px solid #ddd;border-radius:10px}
label{font-weight:bold;margin-top:14px;display:block;font-size:14px}
.btn{width:100%;background:#8B6914;color:#fff;border:none;padding:14px;border-radius:12px;margin-top:18px;font-weight:bold;cursor:pointer}
.error{color:red;text-align:center;margin-top:10px;display:none}
</style></head><body>
<div class="box">
<h1>PlugMasters</h1><p style="text-align:center;color:#888;margin-bottom:10px">Super Admin - 23 Menus</p>
<div style="border:1px dashed #8B6914;padding:10px;border-radius:10px;background:#fffdf5;font-size:13px;margin-bottom:15px">
<b>Default Super Admin:</b><br>Phone: 07067065724<br>PIN: 1234
</div>
<label>Phone Number</label>
<input id="phone" value="07067065724">
<label>Admin PIN</label>
<input id="pin" type="password" value="1234">
<button class="btn" id="loginBtn">➔ Login to Dashboard</button>
<p class="error" id="err">Invalid Phone or PIN</p>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click',function(){
  const phone=document.getElementById('phone').value.trim();
  const pin=document.getElementById('pin').value.trim();
  if(phone==="07067065724" && pin==="1234"){
    localStorage.setItem('pm_admin','super');
    window.location.href='admin-dashboard.html';
  }else{
    document.getElementById('err').style.display='block';
  }
});
</script>
</body></html>
