<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PlugMasters</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#8B6914;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;}
.logo{text-align:center;margin:30px 0;}
.logo b{font-size:28px;color:var(--primary);}
.input-group{margin:14px 0;}
.input-group label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;}
.input-group input{width:100%;padding:14px;border:1.5px solid #EEE;border-radius:12px;outline:none;font-size:14px;}
.input-group input:focus{border-color:var(--primary);}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px;}
.link-row{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;}
.link-row a{color:var(--primary);text-decoration:none;font-weight:600;}
.biometric{margin:20px 0;text-align:center;}
.bio-btn{width:60px;height:60px;border-radius:50%;border:2px solid var(--primary);background:var(--primary-light);font-size:26px;cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="logo"><b>PlugMasters</b><small>Welcome Back Master 👋</small></div>
  <h3 style="margin:20px 0 5px;">Login</h3>
  <p style="font-size:12px;color:#888;">Balance ₦1,429.55 dey wait you</p>

  <div class="input-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="07067065724" value="07067065724"></div>
  <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Enter password" value="123456"></div>

  <div class="link-row">
    <label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" checked> Remember me</label>
    <a href="forgot-password.html">Forgot Password?</a>
  </div>

  <button class="btn" onclick="login()">Login</button>

  <div class="biometric">
    <button class="bio-btn" onclick="alert('Face ID / Fingerprint - Coming with native app')">👆</button>
    <p style="font-size:11px;color:#888;margin-top:6px;">Login with Fingerprint</p>
  </div>

  <div style="text-align:center;margin-top:20px;font-size:13px;">No account? <a href="register.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Register</a></div>

  <div style="margin-top:30px;background:#F9F9F9;padding:12px;border-radius:10px;">
    <small style="font-size:11px;color:#888;">Demo Login:<br>Phone: 07067065724<br>Password: 123456<br>Transaction PIN: 1234</small>
  </div>
</div>
  <script type="module">
import { auth } from './firebase.js';
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginForm = document.querySelector('form');
if(loginForm){
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.querySelector('input[type="email"]')?.value || document.querySelector('input[type="text"]')?.value;
    const password = document.querySelector('input[type="password"]').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert('Login Successful! Welcome to Plugmasters');
      window.location.href = 'index.html';
    } catch(err) {
      alert(err.message);
    }
  });
}
</script>
<script>
function login(){
  let phone=document.getElementById('phone').value, pass=document.getElementById('password').value;
  let users=JSON.parse(localStorage.getItem('plugmasters_users')||'[]');
  let user=users.find(u=>u.phone===phone);
  if(!user){alert("User not found, Register");return;}
  if(user.pass!==pass){alert("Wrong password");return;}
  localStorage.setItem('plugmasters_current_phone',phone);
  localStorage.setItem('plugmasters_is_logged', 'true');
  location.href='index.html';
}
// Auto create demo user if none
(function(){
  let users=JSON.parse(localStorage.getItem('plugmasters_users')||'[]');
  if(users.length===0){
    users.push({name:"James Master",phone:"07067065724",email:"james@gmail.com",pass:"123456",balance:1429.55,cashback:1064.13});
    localStorage.setItem('plugmasters_users',JSON.stringify(users));
  }
})();
</script>
</body>
</html>
