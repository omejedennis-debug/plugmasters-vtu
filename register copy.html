<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - PlugMasters</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#8B6914;--primary-light:#FFF8E6;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;position:relative;}
.logo{text-align:center;margin:20px 0;}
.logo b{font-size:28px;color:var(--primary);}
.logo small{display:block;color:#888;font-size:12px;}
.input-group{margin:14px 0;}
.input-group label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;}
.input-group input{width:100%;padding:14px;border:1.5px solid #EEE;border-radius:12px;outline:none;font-size:14px;}
.input-group input:focus{border-color:var(--primary);}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px;}
.btn:disabled{background:#CCC;}
.divider{text-align:center;margin:16px 0;font-size:12px;color:#888;}
.link{text-align:center;font-size:13px;}
.link a{color:var(--primary);font-weight:700;text-decoration:none;}
.refer-box{background:var(--primary-light);padding:10px;border-radius:10px;border:1px dashed var(--primary);margin-top:10px;}
</style>
</head>
<body>
<div class="phone">
  <div class="logo"><b>PlugMasters</b><small>VTU - Main Build v1</small></div>
  <h3 style="margin:10px 0;">Create Account</h3>
  <p style="font-size:12px;color:#888;">Join 1,245 masters earning cashback</p>

  <div class="input-group"><label>Full Name</label><input type="text" id="fullName" placeholder="James Master"></div>
  <div class="input-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="07067065724"></div>
  <div class="input-group"><label>Email Address</label><input type="email" id="email" placeholder="james@gmail.com"></div>
  <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters"></div>
  <div class="input-group"><label>Referral Code (Optional)</label><div class="refer-box"><input type="text" id="referral" placeholder="PLUG-JAMES-123" style="border:none;background:transparent;padding:8px;width:100%;"></div><small style="font-size:10px;color:var(--primary);">You and your friend get ₦200 each!</small></div>

  <button class="btn" onclick="register()">Create Account</button>
  <div class="divider">Already have account?</div>
  <div class="link"><a href="login.html">Login Here</a></div>
  <p style="font-size:10px;text-align:center;color:#AAA;margin-top:20px;">By registering you agree to our Terms & KYC Policy - Level 1 Limit ₦50,000</p>
</div>
<script>
function register(){
  let name=document.getElementById('fullName').value, phone=document.getElementById('phone').value, email=document.getElementById('email').value, pass=document.getElementById('password').value, ref=document.getElementById('referral').value;
  if(!name||!phone||!pass){alert("Fill all required fields");return;}
  if(phone.length<11){alert("Phone must be 11 digits");return;}
  if(pass.length<6){alert("Password min 6 chars");return;}
  let users=JSON.parse(localStorage.getItem('plugmasters_users')||'[]');
  if(users.find(u=>u.phone===phone)){alert("Phone already registered, Login");return;}
  users.push({name,phone,email,pass,referral:ref||'',balance:1429.55,cashback:1064.13,kyc:1});
  localStorage.setItem('plugmasters_users',JSON.stringify(users));
  localStorage.setItem('plugmasters_current_phone',phone);
  localStorage.setItem('plugmasters_otp', '123456');
  alert("OTP sent: 123456 - For demo");
  location.href='otp-verify.html';
}
</script>
</body>
</html>
