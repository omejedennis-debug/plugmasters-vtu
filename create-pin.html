<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create PIN - PlugMasters</title>
<style>
:root{--primary:#8B6914;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;text-align:center;}
.pin{display:flex;gap:12px;justify-content:center;margin:20px 0;}
.pin input{width:50px;height:55px;text-align:center;font-size:22px;font-weight:800;border:1.5px solid #EEE;border-radius:12px;}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:16px;}
</style>
</head>
<body>
<div class="phone">
<h3 style="margin-top:30px;">Create Transaction PIN</h3>
<p style="font-size:12px;color:#888;">Default is 1234 - You go use am for all payments</p>
<div class="pin">
<input type="password" maxlength="1" id="p1"><input type="password" maxlength="1" id="p2"><input type="password" maxlength="1" id="p3"><input type="password" maxlength="1" id="p4">
</div>
<button class="btn" onclick="savePin()">Create PIN & Continue</button>
<p style="font-size:11px;color:#888;margin-top:12px;">You fit change am later for Settings > Change PIN</p>
</div>
<script>
function savePin(){
let pin=document.getElementById('p1').value+document.getElementById('p2').value+document.getElementById('p3').value+document.getElementById('p4').value;
if(pin.length!==4){alert("Enter 4 digits");return;}
let phone=localStorage.getItem('plugmasters_current_phone');
localStorage.setItem('plugmasters_pin_'+phone,pin);
localStorage.setItem('plugmasters_pin',pin);
localStorage.setItem('plugmasters_is_logged','true');
alert("PIN "+pin+" created! Welcome");
location.href='index.html';
}
</script>
</body>
</html>
