<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP - PlugMasters</title>
<style>
:root{--primary:#8B6914;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;text-align:center;}
.otp{display:flex;gap:10px;justify-content:center;margin:20px 0;}
.otp input{width:45px;height:50px;text-align:center;font-size:20px;font-weight:700;border:1.5px solid #EEE;border-radius:10px;}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:16px;}
</style>
</head>
<body>
<div class="phone">
<h3 style="margin-top:30px;">Verify Phone</h3>
<p style="font-size:12px;color:#888;margin-top:6px;">We sent 6-digit code to <b id="ph"></b><br>Code is 123456 for demo</p>
<div class="otp">
<input maxlength="1" id="o1"><input maxlength="1" id="o2"><input maxlength="1" id="o3"><input maxlength="1" id="o4"><input maxlength="1" id="o5"><input maxlength="1" id="o6">
</div>
<button class="btn" onclick="verify()">Verify OTP</button>
<p style="font-size:12px;margin-top:14px;">Didn't receive? <a href="#" onclick="alert('OTP 123456')" style="color:var(--primary);font-weight:700;">Resend 123456</a></p>
</div>
<script>
document.getElementById('ph').innerText=localStorage.getItem('plugmasters_current_phone')||'07067065724';
function verify(){
let code=document.getElementById('o1').value+document.getElementById('o2').value+document.getElementById('o3').value+document.getElementById('o4').value+document.getElementById('o5').value+document.getElementById('o6').value;
if(code==='123456'){location.href='create-pin.html';}else{alert("Wrong OTP, use 123456");}
}
</script>
</body>
</html>
