<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Phone - PlugMasters</title>
<style>
body{font-family:sans-serif;text-align:center;padding:40px 20px}
.otp-container{display:flex;gap:10px;justify-content:center;margin:20px 0}
.otp-input{width:45px;height:55px;text-align:center;font-size:22px;border:2px solid #ddd;border-radius:12px;font-weight:bold}
.otp-input:focus{border-color:#8B6914;outline:none}
.btn{background:#8B6914;color:#fff;border:none;padding:15px 30px;border-radius:12px;width:100%;max-width:320px;font-weight:bold}
</style></head><body>
<h2>Verify Phone</h2>
<p id="phoneText">We sent 6-digit code</p>
<div class="otp-container">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
</div>
<button class="btn" id="verifyBtn">Verify OTP</button>
<p style="margin-top:15px">Didn't receive? <span id="resend" style="color:#8B6914;text-decoration:underline;font-weight:bold;cursor:pointer">Resend</span></p>
<script>
const inputs=document.querySelectorAll('.otp-input');
const phone=localStorage.getItem('pm_pending_phone')||'09053504806';
document.getElementById('phoneText').textContent=`We sent 6-digit code to ${phone}`;
inputs.forEach((inp,i)=>{
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9]/g,''); if(inp.value&&i<5) inputs[i+1].focus();});
  inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0) inputs[i-1].focus();});
  inp.addEventListener('paste',e=>{let d=e.clipboardData.getData('text').replace(/[^0-9]/g,'').slice(0,6).split(''); d.forEach((c,j)=>{if(inputs[j]) inputs[j].value=c;}); e.preventDefault();});
});
document.getElementById('verifyBtn').onclick=()=>{
  const code=[...inputs].map(x=>x.value).join('');
  if(code.length!==6){alert('Enter 6 digits');return;}
  // Accept any 6 digits for demo, but DON'T show code
  localStorage.setItem('pm_user',JSON.stringify({phone:phone,verified:true}));
  alert('Phone verified!');
  location.href='index.html';
};
document.getElementById('resend').onclick=()=>{
  alert('OTP sent again!');
  inputs[0].focus();
};
inputs[0].focus();
</script></body></html>
