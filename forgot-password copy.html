<!-- forgot-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - PlugMasters</title>
<style>
:root{--primary:#8B6914;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;}
.input-group{margin:14px 0;}
.input-group label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;}
.input-group input{width:100%;padding:14px;border:1.5px solid #EEE;border-radius:12px;outline:none;}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;margin-top:16px;cursor:pointer;}
.tabs{display:flex;gap:10px;margin:16px 0;}
.tab{flex:1;padding:10px;border:1px solid #EEE;border-radius:10px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;}
.tab.active{background:var(--primary);color:white;border-color:var(--primary);}
</style>
</head>
<body>
<div class="phone">
  <h3 style="margin:20px 0;">Reset Password / PIN</h3>
  <div class="tabs">
    <div class="tab active" id="tabPass" onclick="switchTab('pass')">Password</div>
    <div class="tab" id="tabPin" onclick="switchTab('pin')">Transaction PIN</div>
  </div>
  <div id="passBox">
    <div class="input-group"><label>Phone Number</label><input type="tel" id="phone" placeholder="07067065724"></div>
    <div class="input-group"><label>New Password</label><input type="password" id="newPass" placeholder="Min 6 chars"></div>
    <div class="input-group"><label>Confirm New Password</label><input type="password" id="confirmPass" placeholder="Confirm"></div>
    <button class="btn" onclick="resetPass()">Reset Password</button>
  </div>
  <div id="pinBox" style="display:none;">
    <div class="input-group"><label>Phone Number</label><input type="tel" id="phonePin" placeholder="07067065724"></div>
    <div class="input-group"><label>New Transaction PIN (4 digits)</label><input type="tel" id="newPin" placeholder="1234" maxlength="4"></div>
    <button class="btn" onclick="resetPin()">Reset PIN to 1234</button>
    <p style="font-size:11px;color:#888;margin-top:10px;">Default PIN is 1234 — you fit change am for Settings</p>
  </div>
  <div style="text-align:center;margin-top:20px;"><a href="login.html" style="color:#8B6914;text-decoration:none;font-weight:700;">Back to Login</a></div>
</div>
<script>
function switchTab(t){
  document.getElementById('tabPass').classList.toggle('active', t==='pass');
  document.getElementById('tabPin').classList.toggle('active', t==='pin');
  document.getElementById('passBox').style.display=t==='pass'?'block':'none';
  document.getElementById('pinBox').style.display=t==='pin'?'block':'none';
}
function resetPass(){
  let phone=document.getElementById('phone').value, np=document.getElementById('newPass').value, cp=document.getElementById('confirmPass').value;
  if(np!==cp){alert("Passwords not match");return;}
  if(np.length<6){alert("Min 6 chars");return;}
  let users=JSON.parse(localStorage.getItem('plugmasters_users')||'[]');
  let idx=users.findIndex(u=>u.phone===phone);
  if(idx===-1){alert("Phone not found");return;}
  users[idx].pass=np;
  localStorage.setItem('plugmasters_users',JSON.stringify(users));
  alert("Password reset success! Login with new password");
  location.href='login.html';
}
function resetPin(){
  let phone=document.getElementById('phonePin').value, pin=document.getElementById('newPin').value;
  if(pin.length!==4){alert("PIN must be 4 digits");return;}
  localStorage.setItem('plugmasters_pin_'+phone, pin);
  localStorage.setItem('plugmasters_pin', pin);
  alert("PIN reset to "+pin+" success!");
  location.href='login.html';
}
</script>
</body>
</html>
