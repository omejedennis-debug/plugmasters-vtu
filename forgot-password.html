<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot - PlugMasters</title>
<style>
:root{--primary:#8B6914;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#F5F5F5;display:flex;justify-content:center;}
.phone{width:390px;background:white;min-height:100vh;padding:20px;}
label{font-size:12px;font-weight:600;display:block;margin:10px 0 5px;}
input{width:100%;padding:13px;border:1.5px solid #EEE;border-radius:12px;outline:none;}
.btn{width:100%;padding:14px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;margin-top:16px;cursor:pointer;}
.tabs{display:flex;gap:8px;margin:10px 0;}
.tab{flex:1;padding:10px;border:1px solid #EEE;border-radius:10px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;}
.tab.active{background:var(--primary);color:white;}
</style>
</head>
<body>
<div class="phone">
<h3 style="margin:20px 0;">Reset Password / PIN</h3>
<div class="tabs"><div class="tab active" id="t1" onclick="tab('p')">Password</div><div class="tab" id="t2" onclick="tab('i')">PIN 1234</div></div>
<div id="b1">
<label>Phone</label><input id="phone" type="tel" placeholder="07067065724">
<label>New Password</label><input id="np" type="password" placeholder="Min 6">
<label>Confirm Password</label><input id="cp" type="password" placeholder="Confirm">
<button class="btn" onclick="resetP()">Reset Password</button>
</div>
<div id="b2" style="display:none;">
<label>Phone</label><input id="phonePin" type="tel" placeholder="07067065724">
<label>New PIN (4 digits)</label><input id="nPin" maxlength="4" placeholder="1234">
<button class="btn" onclick="resetPin()">Reset PIN</button>
</div>
<p style="text-align:center;margin-top:20px;"><a href="login.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Back to Login</a></p>
</div>
<script>
function tab(t){
document.getElementById('t1').classList.toggle('active',t==='p');
document.getElementById('t2').classList.toggle('active',t==='i');
document.getElementById('b1').style.display=t==='p'?'block':'none';
document.getElementById('b2').style.display=t==='i'?'block':'none';
}
function resetP(){
let ph=document.getElementById('phone').value,np=document.getElementById('np').value,cp=document.getElementById('cp').value;
if(np!==cp){alert("No match");return;}
let users=JSON.parse(localStorage.getItem('plugmasters_users')||'[]');
let i=users.findIndex(u=>u.phone===ph);
if(i===-1){alert("Phone not found");return;}
users[i].pass=np;localStorage.setItem('plugmasters_users',JSON.stringify(users));
alert("Password reset done");location.href='login.html';
}
function resetPin(){
let ph=document.getElementById('phonePin').value,pin=document.getElementById('nPin').value;
if(pin.length!==4){alert("4 digits");return;}
localStorage.setItem('plugmasters_pin_'+ph,pin);
localStorage.setItem('plugmasters_pin',pin);
alert("PIN reset to "+pin);location.href='login.html';
}
</script>
</body>
</html>
